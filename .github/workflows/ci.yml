name: Atria CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atria_test
          POSTGRES_USER: atria
          POSTGRES_PASSWORD: atria_secret
        ports:
          - '5432:5432'
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run Backend Unit & H2 Integration Tests (including ArchUnit)
        working-directory: backend
        run: ./mvnw -B test

      - name: Run PostgreSQL 16 Flyway Migration & Append-Only Trigger Verification
        working-directory: backend
        run: ./mvnw -B test -Dspring.profiles.active=pgtest

  frontend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
