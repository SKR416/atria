spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atria}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:atria}
    password: ${DB_PASSWORD:atria_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    io.github.skr416.atria: INFO
