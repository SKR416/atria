# System & HTTP Errors
error.bad_request=リクエストパラメータの形式が正しくありません
error.validation=入力内容の検証に失敗しました。入力項目をご確認ください
error.unauthorized=ログインしていないか、認証トークンの有効期限が切れています
error.forbidden=この操作を実行する権限がありません
error.not_found=要求されたリソースが見つかりません
error.conflict=データの競合が発生しました。画面を更新して再度お試しください
error.system=システム内部で予期しないエラーが発生しました。管理者にお問い合わせください

# IAM Module Errors (1xxx)
error.iam.invalid_credentials=ユーザー名またはパスワードが正しくありません
error.iam.account_locked=ログイン失敗回数が上限に達したため、アカウントは15分間ロックされました
error.iam.password_change_required=初回ログインのため、初期パスワードの変更が必要です
error.iam.user_not_found=指定されたユーザーアカウントが見つかりません
error.iam.dept_not_found=指定された部門が見つかりません
error.iam.bot_signature_invalid=公認BotのHMAC署名検証に失敗したか、タイムスタンプの有効期限が切れています
error.iam.account_disabled=このアカウントは無効化されています。システム管理者にお問い合わせください
error.iam.role_not_found=指定されたロールが見つかりません
error.iam.role_builtin_immutable=システム組み込みロールは削除またはコード変更できません
error.iam.username_exists=ユーザー名は既に使用されています
error.iam.email_exists=メールアドレスは既に他のアカウントで使用されています
error.iam.dept_code_exists=部門コードは既に存在します
error.iam.role_code_exists=ロールコードは既に存在します
error.iam.dept_in_use=配下に子部門または所属社員が存在するため、この部門を削除できません
error.iam.dept_invalid_parent=親部門の指定が不正です（自身または配下の部門を親に設定することはできません）

# Attendance Module Errors (2xxx)
error.att.punch_duplicate=本日の該当区分は既に打刻済みです
error.att.invalid_leave_range=休暇期間が不正です。終了日時は開始日時より後に設定してください
error.att.attachment_required=この休暇種別には証明書類の添付が必須です
error.att.insufficient_leave_balance=利用可能な休暇残時間（承認待ちの凍結時間を含む）が不足しています
error.att.monthly_period_closed=該当月の勤怠は月次締めロック済みのため、労働時間や申請の追加・変更はできません
error.att.retroactive_limit_exceeded=事後申請の許容期限を過ぎているため、休暇または打刻修正の申請はブロックされました

# Workflow Module Errors (3xxx)
error.wf.instance_not_found=指定された申請書が見つかりません
error.wf.cannot_revoke_approved=この申請は既に最終承認されているため、直接取り下げることはできません
error.wf.unauthorized_approver=現在の承認ステップの担当者または委任された代理承認者ではありません
