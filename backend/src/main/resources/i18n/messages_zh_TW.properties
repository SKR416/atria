# Traditional Chinese Bundle (zh_TW)
common.success=操作成功
system.welcome=歡迎使用 Atria 企業考勤與多層級審批工作流平台

# System & HTTP Errors
error.bad_request=請求參數格式不正確
error.validation=欄位驗證失敗，請檢查輸入內容
error.unauthorized=尚未登入或認證憑證已過期
error.forbidden=權限不足，無法執行此操作
error.not_found=找不到請求的資源
error.conflict=資料狀態衝突，請重新整理後再試
error.system=系統內部發生未預期錯誤，請聯繫系統管理員

# IAM Module Errors (1xxx)
error.iam.invalid_credentials=帳號或密碼錯誤
error.iam.account_locked=密碼連續輸入錯誤已達上限，帳號已暫時鎖定 15 分鐘
error.iam.password_change_required=初次登入或密碼已重設，請先變更密碼後再繼續操作
error.iam.user_not_found=找不到指定的使用者帳號
error.iam.dept_not_found=找不到指定的部門組織
error.iam.bot_signature_invalid=代理 Bot 數位簽章驗證失敗或請求時間戳記已逾時
error.iam.account_disabled=此帳號已被停用，請聯繫系統管理員
error.iam.role_not_found=找不到指定的角色
error.iam.role_builtin_immutable=系統內建角色不可刪除或修改代碼
error.iam.username_exists=使用者帳號名稱已存在
error.iam.email_exists=電子郵件信箱已被其他帳號使用
error.iam.dept_code_exists=部門代碼已存在
error.iam.role_code_exists=角色代碼已存在
error.iam.dept_in_use=該部門下仍有子部門或隸屬員工，無法直接刪除
error.iam.dept_invalid_parent=上層部門設定不合法（不可指定自身或其子孫部門為上層）

# Attendance Module Errors (2xxx)
error.att.punch_duplicate=今日該時段已完成打卡，請勿重複提交
error.att.invalid_leave_range=請假起訖時間區間不合法，結束時間必須大於開始時間
error.att.attachment_required=此假別依規定必須檢附證明文件
error.att.insufficient_leave_balance=該假別可用額度不足（含審核中凍結時數）
error.att.monthly_period_closed=該月份考勤已執行月結關帳鎖定，禁止新增或修改工時與假單紀錄
error.att.retroactive_limit_exceeded=已超過事後補請假或補打卡之允許申請時限，系統直接阻擋受理
error.att.calendar_day_not_found=找不到指定日期的行事曆設定
error.att.unsupported_calendar_code=不支援的行事曆地區範本代碼（目前內建支援 TW 與 JP）
error.att.punch_rule_not_found=找不到指定地區的打卡規則設定
error.att.monthly_close_pending_requests=該月份尚有未簽核結案 (PENDING) 的差勤申請單，請先完成簽核後再執行月結關帳
error.att.monthly_close_already_closed=該月份考勤已處於月結關帳鎖定狀態
error.att.monthly_close_not_found=找不到指定月份的月結關帳紀錄
error.att.invalid_year_month=年月格式不正確（請使用 YYYY-MM 格式）
error.att.leave_type_not_found=找不到指定的假別設定或該假別已停用
error.att.leave_type_code_exists=假別代碼已存在
error.att.leave_grant_rule_not_found=找不到指定的年資特休給假規則
error.att.leave_zero_duration=所選請假區間與表定出勤工時無交集（淨請假時數為 0 分鐘）
error.att.overtime_rate_rule_not_found=找不到指定的加班倍率規則
error.att.overtime_cap_rule_not_found=找不到指定的加班時數上限規則
error.att.overtime_cap_exceeded=申請加班時數已超過法定或企業強制上限（BLOCK），無法提交申請
error.att.invalid_overtime_range=加班起訖時間區間不合法，或單日申請時數超出合理範圍
error.att.comp_leave_ratio_below_one=加班轉補休之折算比例不得低於 1:1
error.att.request_not_found=找不到指定的差勤申請單
error.att.request_invalid_state_transition=申請單目前狀態不允許執行此項狀態變更操作
error.att.comp_leave_used_cannot_revoke=該筆加班單所核發之補休額度已被使用或正處於請假審核中，禁止撤銷原加班單
error.att.comp_grant_not_found=找不到指定的加班補休核發紀錄
error.att.user_hire_date_missing=該員工尚未設定到職日（hire_date），無法依年資自動計算特休額度

# Workflow Module Errors (3xxx)
error.wf.instance_not_found=找不到指定的審批申請單據
error.wf.cannot_revoke_approved=該申請單已全數核准結案，無法直接撤回，請改提銷假或變更申請
error.wf.unauthorized_approver=您並非當前關卡的指定審核人或授權代理人
error.wf.template_not_found=找不到指定的動態表單模板或該模板已停用
error.wf.template_code_exists=動態表單模板代碼已存在
error.wf.flow_def_not_found=找不到指定的簽核流程定義
error.wf.flow_code_exists=簽核流程定義代碼已存在
error.wf.invalid_state_transition=簽核單目前狀態不允許執行此項操作
error.wf.return_to_draft_not_allowed_for_att=差勤類申請單已綁定額度帳本，不支援退回草稿修改，請直接駁回後由申請人重新送單
error.wf.form_validation_failed=動態表單必填欄位缺漏或資料型別不符合 Schema 規範
error.wf.deputy_not_found=找不到指定的職務代理設定
error.wf.deputy_self_delegation_forbidden=職務代理人不得設定為本人
error.wf.deputy_overlapping_period=該時段已存在生效中的職務代理設定，請勿重複設定
error.wf.no_approver_resolved=無法解析出有效的關卡簽核人（部門主管與 HR 角色皆無可用帳號）

# Notification Module Errors (4xxx)
error.ntf.notification_not_found=找不到指定的站內通知紀錄
