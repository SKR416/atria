spring:
  datasource:
    url: jdbc:h2:mem:atria;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    # {vendor} resolves to h2 / postgresql (DDL differs: JSON vs JSONB, partial unique indexes)
    locations: classpath:db/migration/{vendor}

atria:
  security:
    jwt:
      # LOCAL DEVELOPMENT ONLY - never reuse outside the local profile
      secret: ${ATRIA_JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789abcdef}
    refresh-cookie:
      secure: ${ATRIA_COOKIE_SECURE:false}
    bootstrap-admin:
      password: ${ATRIA_BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
  crypto:
    # LOCAL DEVELOPMENT ONLY (Base64 of 32 bytes)
    kek: ${ATRIA_CRYPTO_KEK:bG9jYWwtZGV2LW9ubHktYWVzMjU2LWtlay0zMmJ5dGU=}
  attendance:
    bot:
      hmac-secret: ${ATRIA_BOT_HMAC_SECRET:local-dev-only-bot-hmac-secret-0123456789}

logging:
  level:
    io.github.skr416.atria: DEBUG
